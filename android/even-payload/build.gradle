plugins { id 'com.android.application' }

android {
    namespace 'io.github.reuse.even'
    compileSdk 35
    defaultConfig {
        applicationId 'io.github.reuse.even.payload'
        minSdk 28
        targetSdk 35
        multiDexEnabled false
        versionCode 1
        versionName '0.1.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes {
        release { minifyEnabled false }
    }
}

// Deliberately framework-only. The payload uses the Even APK's native ONNX Runtime.
