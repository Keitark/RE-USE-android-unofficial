plugins { id 'com.android.application' }

android {
    namespace 'io.github.reuse.benchmark'
    compileSdk 35
    defaultConfig {
        applicationId 'io.github.reuse.benchmark'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
        testInstrumentationRunner providers.gradleProperty('reuseRunner').getOrElse('io.github.reuse.benchmark.ReuseBenchmarkInstrumentation')
        ndk { abiFilters 'arm64-v8a', 'x86_64' }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes {
        release { minifyEnabled false }
    }
    packaging { jniLibs { useLegacyPackaging = true } }
}

dependencies { implementation project(':reuse') }
